[workspace]
members = ["crates/protocol", "crates/contract-gen", "crates/core", "crates/cli", "crates/installer-format", "crates/installer-worker"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
ed25519-dalek = "2.2"
base64 = "0.22"
zip = { version = "6", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "gzip", "deflate"] }
schemars = "1"
getrandom = "0.4"
url = "2.5"
encoding_rs = "0.8"
scraper = { version = "0.27", default-features = false, features = ["errors"] }
unicode-normalization = "0.1"
caseless = "0.2"
unicode-general-category = "1"

ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

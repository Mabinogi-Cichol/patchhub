name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo run --locked -p steam-patch-contract-gen -- check
      - run: cargo test --locked -p steam-patch-protocol
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p steam-patch-core -p steam-patch-cli -p steam-patch-protocol -p steam-patch-contract-gen --all-targets --locked -- -D warnings
      - run: cargo test -p steam-patch-core -p steam-patch-cli --locked
      - run: cargo build -p steam-patch-core -p steam-patch-cli --locked
      - run: python -m unittest discover -s apps/decky/backend -p 'test_*.py' -v
      - run: python -m unittest discover -s scripts -p test_package_artifacts.py -v
      - run: python -m unittest discover -s scripts -p test_build_sbom.py -v
      - run: python -m unittest discover -s scripts -p test_sf95_audit.py -v
      - run: python -m unittest discover -s scripts -p test_sf95_worker.py -v

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo run --locked -p steam-patch-contract-gen -- check
      - run: npm ci
      - run: npm run test:contracts
      - run: cargo build --release --locked -p steam-patch-cli -p steam-patch-installer-worker --bin steam-patch --bin sf-worker
      - run: npm run bundle -w apps/windows -- -- --locked
      - run: New-Item -ItemType Directory -Path .artifacts -Force
      - run: cargo metadata --locked --format-version 1 > .artifacts/cargo-metadata.json
      - run: python scripts/build-sbom.py .artifacts/cargo-metadata.json
      - run: python scripts/package-artifacts.py --platform windows
      - run: git diff --exit-code -- Cargo.lock package-lock.json packages/contracts/generated packages/contracts/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            .artifacts/steam-patch-manager-windows-portable.zip
            .artifacts/checksums-windows.json
            .artifacts/dependencies.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [core, windows, decky]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: release-input
      - uses: actions/download-artifact@v4
        with:
          name: decky-plugin
          path: release-input/decky-plugin
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp release-input/windows-portable/steam-patch-manager-windows-portable.zip release-assets/
          cp release-input/windows-portable/checksums-windows.json release-assets/
          cp release-input/windows-portable/dependencies.cdx.json release-assets/dependencies-windows.cdx.json
          for installer in release-input/windows-nsis/*.exe; do
            filename="$(basename "$installer")"
            cp "$installer" "release-assets/${filename// /.}"
          done
          cp release-input/decky-plugin/steam-patch-manager-decky.zip release-assets/
          cp release-input/decky-plugin/checksums-decky.json release-assets/
          cp release-input/decky-plugin/dependencies.cdx.json release-assets/dependencies-decky.cdx.json
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
  decky:
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: target/linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo run --locked -p steam-patch-contract-gen -- check
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npm run test -w apps/decky
      - run: cargo build --release --locked -p steam-patch-cli -p steam-patch-installer-worker --bin steam-patch --bin sf-worker
      - run: npm run package:plugin -w apps/decky
      - run: mkdir -p .artifacts
      - run: cargo metadata --locked --format-version 1 > .artifacts/cargo-metadata.json
      - run: python scripts/build-sbom.py .artifacts/cargo-metadata.json
      - run: python scripts/package-artifacts.py --platform decky
      - run: git diff --exit-code -- Cargo.lock package-lock.json packages/contracts/generated packages/contracts/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: decky-plugin
          path: |
            .artifacts/steam-patch-manager-decky.zip
            .artifacts/checksums-decky.json
            .artifacts/dependencies.cdx.json
          if-no-files-found: error

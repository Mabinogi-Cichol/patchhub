name: Build and test
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      core: ${{ steps.select.outputs.core }}
      windows: ${{ steps.select.outputs.windows }}
      decky: ${{ steps.select.outputs.decky }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v
      - id: select
        run: python3 .github/ci/select_jobs.py

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo run --locked -p patchhub-contract-gen -- check
      - run: cargo test --locked -p patchhub-protocol
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p patchhub-core -p patchhub-cli -p patchhub-protocol -p patchhub-contract-gen --all-targets --locked -- -D warnings
      - run: cargo test -p patchhub-core -p patchhub-cli --locked
      - run: cargo build -p patchhub-core -p patchhub-cli --locked
      - run: python -m unittest discover -s scripts -p test_sf95_audit.py -v
      - run: python -m unittest discover -s scripts -p test_sf95_worker.py -v

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_package_artifacts.py -v
      - run: python -m unittest discover -s scripts -p test_build_sbom.py -v
      - run: python -m unittest discover -s scripts -p test_flutter_sbom.py -v
      - run: python -m unittest discover -s scripts -p test_windows_update.py -v
      - run: python -m unittest discover -s scripts -p test_windows_single_instance.py -v
      - run: cargo run --locked -p patchhub-contract-gen -- check
      - run: npm ci
      - run: npm run test:contracts
      - run: cargo build --release --locked -p patchhub-cli -p patchhub-installer-worker --bin patchhub-core --bin patchhub-worker
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: ./scripts/build-windows-flutter.ps1 -SkipRust
      - run: New-Item -ItemType Directory -Path .artifacts -Force
      - run: cargo metadata --locked --format-version 1 > .artifacts/cargo-metadata.json
      - run: python scripts/build-sbom.py .artifacts/cargo-metadata.json --flutter-deps .artifacts/windows-flutter/pub-deps.json --flutter-version .artifacts/windows-flutter/flutter-version.json
      - run: python scripts/package-artifacts.py --platform windows
      - run: choco install nsis --yes --no-progress
      - run: ./scripts/build-windows-installer.ps1 -Makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - run: git diff --exit-code -- Cargo.lock package-lock.json packages/contracts/generated packages/contracts/fixtures apps/windows-flutter/pubspec.lock apps/windows-flutter/assets/protocol-v5.schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            .artifacts/patchhub-windows-portable.zip
            .artifacts/checksums-windows.json
            .artifacts/dependencies.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: .artifacts/patchhub-windows-x64-setup.exe
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: [core, windows, decky]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: release-input
      - uses: actions/download-artifact@v4
        with:
          name: decky-plugin
          path: release-input/decky-plugin
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp release-input/windows-portable/patchhub-windows-portable.zip release-assets/
          for installer in release-input/windows-nsis/*.exe; do
            filename="$(basename "$installer")"
            cp "$installer" "release-assets/${filename// /.}"
          done
          cp release-input/decky-plugin/patchhub-decky.zip release-assets/
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo 'Release already public; refusing to replace published assets'
              exit 1
            }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release download "$RELEASE_TAG" --dir verify-release
          (cd verify-release && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --title "$RELEASE_TAG"
  decky:
    needs: changes
    if: needs.changes.outputs.decky == 'true'
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: target/linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s apps/decky/backend -p 'test_*.py' -v
      - run: python -m unittest discover -s scripts -p test_package_artifacts.py -v
      - run: python -m unittest discover -s scripts -p test_build_sbom.py -v
      - run: python -m unittest discover -s scripts -p test_install_decky.py -v
      - run: python -m unittest discover -s scripts -p test_decky_bootstrap.py -v
      - run: cargo run --locked -p patchhub-contract-gen -- check
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npm run test -w apps/decky
      - run: node --test scripts/test-install-decky-bridge.mjs
      - run: cargo build --release --locked -p patchhub-cli -p patchhub-installer-worker --bin patchhub-core --bin patchhub-worker
      - run: npm run package:plugin -w apps/decky
      - run: mkdir -p .artifacts
      - run: cargo metadata --locked --format-version 1 > .artifacts/cargo-metadata.json
      - run: python scripts/build-sbom.py .artifacts/cargo-metadata.json
      - run: python scripts/package-artifacts.py --platform decky
      - run: git diff --exit-code -- Cargo.lock package-lock.json packages/contracts/generated packages/contracts/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: decky-plugin
          path: |
            .artifacts/patchhub-decky.zip
            .artifacts/checksums-decky.json
            .artifacts/dependencies.cdx.json
          if-no-files-found: error

  ci:
    needs: [changes, core, windows, decky]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check selected jobs succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          WINDOWS: ${{ needs.windows.result }}
          DECKY: ${{ needs.decky.result }}
        run: |
          test "$CHANGES" = success
          for result in "$CORE" "$WINDOWS" "$DECKY"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

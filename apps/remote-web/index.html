<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatchHub Remote</title>
  <link rel="stylesheet" href="/tabler.min.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="page">
  <header class="navbar">
    <div class="container-xl"><span class="navbar-brand">PatchHub Remote</span></div>
  </header>
  <main class="page-wrapper">
    <div class="container-xl py-4">
      <h1 class="page-title">全局来源</h1>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="login" class="card mt-3">
        <div class="card-body">
          <h2 class="card-title">连接设备</h2>
          <form id="login-form">
            <label class="form-label" for="key">访问密钥</label>
            <div class="input-group">
              <input id="key" class="form-control" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="六位数字" autocomplete="off" required>
              <button class="btn btn-primary">连接</button>
            </div>
          </form>
        </div>
      </section>
      <div id="workspace" hidden>
        <div class="d-flex flex-wrap gap-2 my-3">
          <button id="import" class="btn btn-primary">导入脚本来源</button>
          <button id="update-all" class="btn">更新全部</button>
          <button id="refresh" class="btn">刷新列表</button>
        </div>
        <dialog id="editor" class="editor-drawer" aria-labelledby="editor-title">
          <div class="card-body p-3 p-sm-4">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
              <h2 id="editor-title" class="h3 m-0"></h2>
              <button id="close-editor" class="btn editor-action" autofocus>关闭</button>
            </div>
            <div id="editor-notice" role="status"></div>
            <div id="import-tools">
              <label class="form-label" for="file">选择 Lua 文件</label>
              <input id="file" class="form-control mb-3" type="file" accept=".lua,text/plain">
              <button id="prompt-copy" class="btn btn-outline-secondary editor-action mb-2">复制 AI 提示词</button>
              <div id="prompt-feedback" role="status"></div>
              <details id="prompt-box" class="mb-3">
                <summary id="prompt-label">查看 AI 提示词</summary>
                <textarea id="prompt" class="form-control mt-2" aria-labelledby="prompt-label" rows="8" readonly></textarea>
              </details>
            </div>
            <label class="form-label" for="code">Lua 源码</label>
            <textarea id="code" class="form-control code" rows="16" spellcheck="false"></textarea>
            <div class="d-flex gap-2 mt-3">
              <button id="save" class="btn btn-primary editor-action">保存</button>
            </div>
          </div>
        </dialog>
        <div id="sources"></div>
      </div>
    </div>
  </main>
</body>
</html>
